<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterpay J27 — Central da Operação</title>
<style>
  :root{
    --navy:#0F2A43;
    --navy-2:#123453;
    --ink:#17202B;
    --muted:#5C6B7A;
    --line:#E3E8EE;
    --accent:#1E88E5;
    --accent-dark:#0D47A1;
    --bg:#F7F9FC;
    --card:#FFFFFF;
    --warn-bg:#FFF4E5;
    --warn-border:#E8A33D;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1420; --card:#121D2C; --ink:#EAF0F7; --muted:#93A2B3; --line:#233348;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1420; --card:#121D2C; --ink:#EAF0F7; --muted:#93A2B3; --line:#233348;
  }

  .app{display:flex; min-height:100%;}

  /* SIDEBAR */
  .sidebar{
    width:290px; flex-shrink:0;
    background:var(--navy);
    color:#E6EEF7;
    padding:22px 14px 22px 14px;
    padding-top:calc(22px + env(safe-area-inset-top,0px));
    overflow-y:auto;
  }
  .brand{
    font-size:15px; font-weight:700; letter-spacing:.2px;
    padding:4px 10px 18px 10px; color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:10px;
  }
  .brand span{display:block; font-weight:400; font-size:12px; color:#9FB4CC; margin-top:3px;}

  .module{margin-bottom:4px;}
  .module-btn{
    width:100%; text-align:left; background:none; border:none; color:#E6EEF7;
    font-size:14px; font-weight:600; padding:11px 10px; border-radius:8px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
    font-family:inherit;
  }
  .module-btn:hover{background:rgba(255,255,255,.06);}
  .module-btn.active{background:var(--accent); color:#fff;}
  .module-icon{
    width:26px; height:26px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.1); font-size:13px;
  }
  .module-btn.active .module-icon{background:rgba(255,255,255,.22);}
  .chev{margin-left:auto; font-size:11px; transition:transform .15s ease; opacity:.7;}
  .module.open .chev{transform:rotate(90deg);}

  .submenu{
    max-height:0; overflow:hidden; transition:max-height .18s ease;
    padding-left:12px;
  }
  .module.open .submenu{max-height:420px;}
  .sub-btn{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:#B9CBE0; font-size:13px; padding:8px 10px 8px 30px; border-radius:7px;
    cursor:pointer; font-family:inherit; border-left:2px solid transparent;
  }
  .sub-btn:hover{color:#fff; background:rgba(255,255,255,.05);}
  .sub-btn.active{color:#fff; border-left:2px solid var(--accent); background:rgba(255,255,255,.06); font-weight:600;}

  /* MAIN */
  main{
    flex:1; min-width:0; overflow-y:auto;
    padding:38px 5vw 80px 5vw;
    padding-top:calc(38px + env(safe-area-inset-top,0px));
  }
  .content{max-width:760px; margin:0 auto;}
  .eyebrow{color:var(--accent); font-size:12.5px; font-weight:600; margin-bottom:6px;}
  h1.page-title{font-size:28px; font-weight:800; margin:0 0 6px 0; letter-spacing:-.3px;}
  .lede{color:var(--muted); font-size:15px; margin:0 0 28px 0; line-height:1.55;}

  h2.sec{font-size:18px; font-weight:700; margin:30px 0 10px 0; color:var(--ink);}
  p{line-height:1.65; font-size:14.5px; color:var(--ink); margin:0 0 14px 0;}
  ul, ol{line-height:1.65; font-size:14.5px; margin:0 0 16px 0; padding-left:20px;}
  li{margin-bottom:6px;}
  strong{font-weight:700;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin:16px 0; box-shadow:0 1px 2px rgba(15,42,67,.04);
  }
  .card-title{font-weight:700; font-size:13.5px; color:var(--accent-dark); margin-bottom:8px;}
  :root[data-theme="dark"] .card-title, @media (prefers-color-scheme: dark){ .card-title{color:#6FB0F2;} }

  .warn{
    background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:10px;
    padding:16px 18px; margin:16px 0;
  }
  :root[data-theme="dark"] .warn{ background:#2A2213; }
  .warn-title{font-weight:700; font-size:13.5px; color:#8A5A00; margin-bottom:8px;}
  :root[data-theme="dark"] .warn-title{ color:#F0B84D; }

  table{width:100%; border-collapse:collapse; margin:14px 0 20px 0; font-size:13.5px;}
  th{background:var(--navy); color:#fff; text-align:left; padding:9px 10px; font-weight:600;}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:nth-child(even) td{background:rgba(30,136,229,0.045);}

  .table-wrap{overflow-x:auto;}

  .badges{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 22px 0;}
  .badge{
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:700;
    color:#fff; letter-spacing:.2px;
  }
  .badge .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.85);}
  .badge.ml{background:#FFE600; color:#1A1A1A;}
  .badge.shopee{background:#EE4D2D;}
  .badge.hype{background:#7B2FF7;}

  .market-btns{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px 0;}
  .mbtn{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:700; color:#fff !important;
  }
  .mbtn.shopee{background:#EE4D2D;}
  .mbtn.ml{background:#FFE600; color:#1A1A1A !important;}
  .mbtn.hype{background:#7B2FF7; opacity:.55; cursor:default;}
  .mbtn small{font-weight:500; opacity:.9;}
  .pending{
    border:1px dashed var(--warn-border); border-radius:8px; padding:10px 12px;
    font-size:12.5px; color:var(--muted); margin:8px 0;
  }

  .link-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:#fff !important; text-decoration:none;
    padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600;
    margin:6px 0 16px 0;
  }
  .link-btn:hover{background:var(--accent-dark);}
  .example{
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0;
    background:var(--card);
  }
  .example .ex-label{font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
  .example p{margin:0 0 6px 0; font-size:14px;}
  .bench-good{color:#1B8A3D; font-weight:700;}
  .bench-mid{color:#B8860B; font-weight:700;}
  .bench-bad{color:#C0392B; font-weight:700;}

  /* LOGIN GATE */
  #loginGate{
    position:fixed; inset:0; z-index:100; background:var(--navy);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:#132C46; border:1px solid rgba(255,255,255,.08); border-radius:14px;
    padding:36px 32px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .login-brand{color:#fff; font-size:18px; font-weight:800; text-align:center; margin-bottom:4px;}
  .login-sub{color:#9FB4CC; font-size:12.5px; text-align:center; margin-bottom:24px;}
  .login-card label{display:block; color:#B9CBE0; font-size:12.5px; font-weight:600; margin:14px 0 6px 0;}
  .login-card input{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06); color:#fff; font-size:14px; font-family:inherit;
  }
  .login-card input::placeholder{color:#6b7d92;}
  .login-btn{
    width:100%; margin-top:22px; padding:12px; border:none; border-radius:8px;
    background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:inherit;
  }
  .login-btn:hover{background:var(--accent-dark);}
  .login-error{
    color:#FF8A8A; font-size:12.5px; margin-top:12px; text-align:center; min-height:16px;
  }
  .logout-link{
    display:block; text-align:center; color:#7C93AC; font-size:11.5px; padding:14px 10px 4px 10px;
    cursor:pointer; border-top:1px solid rgba(255,255,255,.1); margin-top:10px;
  }
  .logout-link:hover{color:#fff;}

  .campaign-shot{
    max-width:100%; display:block; border-radius:8px; border:1px solid var(--line);
    margin:10px 0 18px 0; box-shadow:0 1px 3px rgba(15,42,67,.08);
  }
  .campaign-shot-cap{font-size:11.5px; color:var(--muted); margin:-12px 0 18px 0;}

  .formula{
    font-family:'SF Mono',Consolas,monospace; background:var(--navy); color:#EAF3FF;
    padding:14px 16px; border-radius:8px; font-size:13px; margin:14px 0; overflow-x:auto;
  }

  @media (max-width: 860px){
    .sidebar{
      position:fixed; left:0; top:0; bottom:0; z-index:20;
      transform:translateX(-100%); transition:transform .2s ease;
      width:78vw; max-width:300px;
    }
    .sidebar.mobile-open{transform:translateX(0);}
    .menu-toggle{
      display:flex; position:sticky; top:calc(10px + env(safe-area-inset-top,0px)); z-index:10;
      align-items:center; gap:8px; background:var(--navy); color:#fff; border:none;
      padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:16px;
      cursor:pointer;
    }
    .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:15;}
    .overlay.show{display:block;}
    main{padding:14px 5vw 60px 5vw;}
  }
  @media (min-width: 861px){ .menu-toggle{display:none;} }
</style>
</head>
<body>
<!-- Acesso público para estudo: login removido a pedido do proprietário. -->
  <div class="app" id="appRoot">

  <div class="overlay" id="overlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="brand">Afterpay J27<span>Guia de módulos da operação</span></div>
    <div id="menu"></div>
    <div class="logout-link" id="logoutLink">Sair</div>
  </nav>

  <main>
    <button class="menu-toggle" id="menuToggle">☰ Módulos</button>
    <div class="content" id="content"></div>
  </main>

</div>

<script>/* Acesso público: autenticação removida. */</script>

<script>
const DATA = {
  intro: {
    icon:"🏠", label:"Visão geral", standalone:true,
    title:"Visão geral da operação",
    lede:"Como Facebook, WhatsApp, marketplaces e pagamento na entrega se conectam numa única esteira de vendas.",
    html:`
      <div class="badges">
        <span class="badge ml"><span class="dot"></span>Mercado Livre</span>
        <span class="badge shopee"><span class="dot"></span>Shopee</span>
        <span class="badge hype"><span class="dot"></span>Hype (afiliados)</span>
      </div>
      <p>Essa operação funciona em cima de quatro pilares que se conectam: <strong>tráfego pago</strong> (Facebook/Meta Ads) para gerar interesse, <strong>WhatsApp</strong> para fechar a conversa e a venda, <strong>fornecimento</strong> via Shopee/Mercado Livre ou como afiliado pela Hype, e <strong>pagamento na entrega</strong> (Pix, boleto ou cartão) para reduzir a fricção da compra.</p>
      <div class="card">
        <div class="card-title">Como as peças se encaixam</div>
        <ul>
          <li><strong>Anúncio (Meta)</strong> → leva a pessoa a chamar no WhatsApp ou clicar num link;</li>
          <li><strong>WhatsApp</strong> → atendimento, tira dúvida, fecha o pedido e coleta o endereço;</li>
          <li><strong>Fornecimento</strong> → produto é comprado na Shopee/Mercado Livre para revenda <strong>ou</strong> repassado como afiliado pela Hype;</li>
          <li><strong>Cobrança</strong> → na entrega ou por Pix/boleto/cartão, conforme combinado com o cliente.</li>
        </ul>
      </div>
      <p>Cada módulo ao lado detalha uma etapa com o cuidado de manter a operação <strong>dentro das políticas das plataformas</strong> — é isso que garante que ela continue rodando sem conta banida, chip bloqueado ou cliente insatisfeito.</p>
    `
  },
  facebook: {
    icon:"📘", label:"Facebook / Meta Ads",
    subs:{
      pagina:{ label:"Página", title:"Criando a página",
        html:`<p>Crie uma página de Facebook com as características do produto ou do nicho que você vai vender. Use nome, foto de perfil e capa coerentes com o que está sendo vendido.</p>
        <a class="link-btn" href="https://www.facebook.com/pages/create" target="_blank" rel="noopener">🔗 Criar página agora (facebook.com/pages/create)</a>
        <p>No link, escolha <strong>"Negócios ou marca"</strong>, defina o nome, a categoria e finalize com foto de perfil, capa e descrição.</p>

        <h2 class="sec">Exemplos de nicho, nome e persona</h2>
        <div class="example">
          <div class="ex-label">Nicho 1 — Estética automotiva (resina)</div>
          <p><strong>Nome da página:</strong> "AutoBrilho Estética Automotiva"</p>
          <p><strong>Persona/atendente:</strong> "Rodrigo, especialista em estética automotiva"</p>
          <p><strong>Bio sugerida:</strong> "Produtos de proteção e brilho para o seu carro, com aplicação simples em casa. Fale com o Rodrigo e tire suas dúvidas antes de comprar 🚗"</p>
        </div>
        <div class="example">
          <div class="ex-label">Nicho 2 — Moda / modeladores</div>
          <p><strong>Nome da página:</strong> "Studio Bella Forma"</p>
          <p><strong>Persona/atendente:</strong> "Camila, consultora de produtos"</p>
          <p><strong>Bio sugerida:</strong> "Peças modeladoras selecionadas para o seu dia a dia. Atendimento direto com a Camila pelo WhatsApp."</p>
        </div>

        <div class="card"><div class="card-title">Sobre a foto da persona/atendente</div>
        <p style="margin:0 0 6px 0">Dá para gerar a imagem por IA (ChatGPT/geradores de imagem) ou usar sua própria foto — a escolha é sua. O importante é manter a mesma imagem em todos os pontos de contato (página, WhatsApp) para passar consistência, e não inventar uma história falsa se o cliente perguntar diretamente quem está atendendo.</p></div>

        <div class="card"><div class="card-title">Checklist de página saudável</div>
        <ul>
          <li>Perfil e capa com imagens próprias (evite fotos genéricas repetidas em várias páginas);</li>
          <li>Descrição clara sobre o que é vendido;</li>
          <li>Política de troca/devolução e prazo de entrega visíveis;</li>
          <li>Formas de contato reais (WhatsApp, e-mail).</li>
        </ul></div>`},
      bm:{ label:"BM e conta de anúncios", title:"Business Manager e conta de anúncios",
        html:`<p>Dentro do Business Manager (hoje parte do <strong>Meta Business Suite</strong>) você organiza páginas, contas de anúncio e usuários. Uma BM pode ter até <strong>5 contas de anúncio</strong> — na prática, isso serve para separar operações ou produtos diferentes, e não para reativar campanhas que caíram por violação de política.</p>
        <a class="link-btn" href="https://business.facebook.com" target="_blank" rel="noopener">🔗 Acessar Meta Business Suite (business.facebook.com)</a>
        <p>Dentro dele: clique em <strong>"Criar conta"</strong>, preencha os dados do negócio e vincule a página criada no passo anterior.</p>
        <p><strong>Pelo Facebook comum:</strong> menu lateral → "Gerenciador de negócios" → mesmo fluxo de criação acima.</p>

        <h2 class="sec">Criar a conta de anúncios</h2>
        <ol>
          <li>Dentro do Business Suite, vá em <strong>Configurações do negócio</strong> (ícone de engrenagem);</li>
          <li>No menu lateral, clique em <strong>Contas → Contas de anúncio</strong>;</li>
          <li>Clique em <strong>Adicionar → Criar uma nova conta de anúncios</strong>;</li>
          <li>Defina fuso horário, moeda e vincule a forma de pagamento.</li>
        </ol>

        <div class="warn"><div class="warn-title">⚠ Sobre múltiplas contas de anúncio</div>
        <p style="margin:0">Usar várias contas dentro da mesma BM para "testar" anúncios já recusados ou banidos é interpretado pela Meta como tentativa de burlar a moderação. Isso derruba a BM inteira, inclusive as contas saudáveis. O caminho seguro é revisar o motivo da recusa (imagem, texto, página de destino) e corrigir o anúncio.</p></div>`},
      metricas:{ label:"Métricas", title:"Entendendo as métricas do Gerenciador de Anúncios",
        html:`<p>Métricas que você acompanha todo dia para saber se o anúncio está saudável e lucrativo:</p>
        <div class="table-wrap"><table>
        <tr><th>Métrica</th><th>O que significa</th><th>O que observar</th></tr>
        <tr><td>CPM</td><td>Custo por mil impressões</td><td>Muito alto pode indicar público saturado</td></tr>
        <tr><td>CTR</td><td>Taxa de cliques</td><td>Baixo = criativo/copy não chamam atenção</td></tr>
        <tr><td>CPC</td><td>Custo por clique</td><td>Compare com o valor do produto</td></tr>
        <tr><td>CPA</td><td>Custo por resultado</td><td>Precisa caber na sua margem</td></tr>
        <tr><td>ROAS</td><td>Retorno sobre investimento</td><td>Abaixo de 1 = prejuízo no tráfego</td></tr>
        <tr><td>Frequência</td><td>Vezes que a mesma pessoa viu</td><td>Acima de 3–4 indica fadiga de criativo</td></tr>
        <tr><td>Hook rate (retenção 3s)</td><td>% que assiste aos 3 primeiros segundos do vídeo</td><td>Baixo = gancho inicial fraco, troque os 2 primeiros segundos</td></tr>
        <tr><td>ThruPlay</td><td>Visualizações até o fim (ou 15s)</td><td>Mede se o criativo prende do início ao fim</td></tr>
        <tr><td>Vídeo 25/50/75/100%</td><td>% que assistiu cada trecho do vídeo</td><td>Queda brusca mostra onde o vídeo perde a pessoa</td></tr>
        <tr><td>Custo por mensagem/conversa iniciada</td><td>Quanto custa cada contato que chega no WhatsApp</td><td>Principal métrica pra campanha objetivo "mensagens"</td></tr>
        <tr><td>Cliques no link (únicos)</td><td>Pessoas únicas que clicaram no link do anúncio</td><td>Diferente de CTR geral, evita contar clique repetido</td></tr>
        <tr><td>Valor gasto / Resultados</td><td>Total investido e nº de resultados no período</td><td>Base para calcular o CPA real da campanha</td></tr>
        <tr><td>Taxa de engajamento</td><td>Curtidas + comentários + compartilhamentos ÷ alcance</td><td>Engajamento alto ajuda a baratear o CPM com o tempo</td></tr>
        </table></div>

        <h2 class="sec">Escala de referência (colunas para montar no Gerenciador)</h2>
        <p>No Gerenciador de Anúncios, personalize as colunas para deixar essas métricas visíveis lado a lado. Como referência geral (varia por nicho e criativo):</p>
        <div class="table-wrap"><table>
        <tr><th>Métrica</th><th class="bench-good">Bom</th><th class="bench-mid">Atenção</th><th class="bench-bad">Ruim</th></tr>
        <tr><td>CTR (todos)</td><td class="bench-good">acima de 1,5%</td><td class="bench-mid">0,8% a 1,5%</td><td class="bench-bad">abaixo de 0,8%</td></tr>
        <tr><td>Hook rate (3s)</td><td class="bench-good">acima de 30%</td><td class="bench-mid">15% a 30%</td><td class="bench-bad">abaixo de 15%</td></tr>
        <tr><td>Frequência</td><td class="bench-good">até 2</td><td class="bench-mid">2 a 4</td><td class="bench-bad">acima de 4</td></tr>
        <tr><td>ROAS</td><td class="bench-good">acima de 2</td><td class="bench-mid">1 a 2</td><td class="bench-bad">abaixo de 1</td></tr>
        </table></div>
        <p><strong>Regra prática:</strong> some custo do produto + CPA médio + taxa de inadimplência do pagamento na entrega. Se ultrapassar o preço de venda, a campanha está dando prejuízo mesmo gerando conversas.</p>`}
    }
  },
  whatsapp: {
    icon:"💬", label:"WhatsApp",
    subs:{
      config:{ label:"Configuração", title:"WhatsApp Business — configuração e catálogo",
        html:`<p>Depois que o tráfego chega, é no WhatsApp que a venda é fechada. Um número mal configurado é a forma mais comum de perder toda a operação de um dia para o outro.</p>
        <ol>
          <li>Use um chip dedicado exclusivamente a essa operação;</li>
          <li>Configure como <strong>WhatsApp Business</strong>, com nome, foto e categoria coerentes;</li>
          <li>Preencha descrição, horário de atendimento e área de atuação;</li>
          <li>Monte o <strong>catálogo</strong> com fotos, preço e descrição — use se quiser oferecer mais produtos ao cliente, opcional se você estiver rodando só 1-2 produtos.</li>
        </ol>
        <p>É comum montar uma identidade visual (nome, foto de "loja") para o número. Se o cliente perguntar diretamente, não negue nem invente uma história sobre ser uma empresa que não existe. Ter uma marca é diferente de fingir ser outra empresa.</p>`},
      aquecimento:{ label:"Aquecimento de chip", title:"Aquecimento de número (do jeito certo)",
        html:`<p>Número novo tem limite de envio e é monitorado com mais rigor nas primeiras semanas. O objetivo é mostrar um <strong>padrão de uso humano e gradual</strong>, não burlar a detecção de spam.</p>
        <div class="card"><div class="card-title">Como aquecer de forma orgânica</div>
        <ul>
          <li>Comece com poucas mensagens por dia e aumente aos poucos por 1–2 semanas;</li>
          <li>Tenha conversas reais de ida e volta;</li>
          <li>Salve o número na agenda de contatos reais;</li>
          <li>Use o número normalmente (áudio, foto, chamada);</li>
          <li>Evite links suspeitos e texto idêntico para muita gente ao mesmo tempo.</li>
        </ul></div>
        <div class="warn"><div class="warn-title">⚠ Sobre entrar em grupos só para "esquentar"</div>
        <p style="margin:0">Entrar em vários grupos desconhecidos apenas para gerar volume tende a <strong>aumentar</strong> denúncias e bloqueios, porque o padrão foge do uso normal. O efeito costuma ser o oposto do desejado. Prefira aquecer com tráfego real chegando aos poucos pelo anúncio.</p></div>`},
      automacao:{ label:"Automação e funil", title:"Automação de atendimento e funil de vendas",
        html:`<p>Automação é o que permite atender muita gente sem perder qualidade. Fluxo básico de um funil via WhatsApp:</p>
        <ol>
          <li><strong>Primeira mensagem automática:</strong> saudação + pergunta que qualifica o interesse;</li>
          <li><strong>Apresentação do produto:</strong> catálogo, imagem ou vídeo curto gerado com IA;</li>
          <li><strong>Quebra de objeção:</strong> prazo, forma de pagamento, garantia;</li>
          <li><strong>Fechamento:</strong> confirmação do produto, endereço e pagamento;</li>
          <li><strong>Pós-venda:</strong> código de rastreio e acompanhamento.</li>
        </ol>
        <p>Ferramentas de automação permitem montar essas etapas como um fluxograma, com respostas automáticas e transferência para atendimento humano quando o cliente sai do script.</p>
        <div class="card"><div class="card-title">Boa prática</div>
        <ul>
          <li>Sempre deixe uma porta de saída para falar com uma pessoa real;</li>
          <li>Revise o fluxo com base nas perguntas mais comuns do atendimento humano;</li>
          <li>Não deixe o bot prometer o que a operação não consegue cumprir.</li>
        </ul></div>`}
    }
  },
  criativos: {
    icon:"🎬", label:"Criativos com IA", standalone:true,
    title:"Criativos com Inteligência Artificial",
    lede:"Como usar IA para escrever, gerar vídeo e buscar referência de criativos que já estão rodando.",
    html:`<p>Ferramentas de geração de vídeo e imagem por IA (como Google Flow/VO3 e outras plataformas) ajudam a produzir criativos de anúncio rapidamente, sem precisar gravar tudo do zero.</p>
    <a class="link-btn" href="https://labs.google/flow/" target="_blank" rel="noopener">🔗 Google Flow (VO3) — labs.google/flow</a>

    <div class="card"><div class="card-title">Sobre o VO3</div>
    <p style="margin:0">O VO3 gera clipes de <strong>8 segundos</strong> por vez. Na prática isso muda o processo:</p>
    <ul style="margin-top:8px">
      <li>Primeiro escreva o <strong>texto/gancho persuasivo</strong> pensando no que cabe nesses 8 segundos (a ideia principal precisa aparecer logo no início, olha o hook rate no módulo de Métricas);</li>
      <li>Depois transforme esse texto em vídeo com a IA;</li>
      <li>Pra vídeos mais longos, gere vários clipes de 8s em sequência e una no editor (CapCut, Premiere, etc.).</li>
    </ul></div>

    <h2 class="sec">Minerar referência na Biblioteca de Anúncios</h2>
    <p>A própria Meta disponibiliza publicamente todos os anúncios ativos de qualquer página, como ferramenta de transparência.</p>
    <a class="link-btn" href="https://www.facebook.com/ads/library" target="_blank" rel="noopener">🔗 Biblioteca de Anúncios da Meta</a>
    <p>Use pra estudar estrutura, gancho e formato de anúncios que já estão rodando bem no seu nicho — sirva de inspiração pra criar o seu, evite copiar um anúncio de outra marca de forma idêntica.</p>
    <div class="card"><div class="card-title">Extensão de download</div>
    <p style="margin:0 0 8px 0">A extensão que baixa vídeos direto da Biblioteca de Anúncios é a <strong>AdLibNote</strong>.</p>
    <a class="link-btn" href="https://chrome.google.com/webstore/detail/efaadoiclcgkpnjfgbaiplhebcmbipnn" target="_blank" rel="noopener">🔗 AdLibNote — Chrome Web Store</a>
    </div>

    <ul>
      <li>Ferramentas gratuitas costumam oferecer créditos limitados — bom para testar formatos antes de investir;</li>
      <li>Ferramentas pagas liberam mais qualidade, resolução e controle sobre o resultado;</li>
      <li>Teste mais de uma variação e deixe o Gerenciador de Anúncios mostrar qual performa melhor;</li>
      <li>Evite criativo que prometa algo que o produto não entrega — isso aumenta reembolso e recusa na análise do anúncio.</li>
    </ul>`
  },
  vendas: {
    icon:"📦", label:"Vendas e pagamento",
    subs:{
      modelo:{ label:"Modelo de vendas", title:"Shopee, Mercado Livre e afiliados (Hype)",
        html:`<h2 class="sec" style="margin-top:0">Revenda (comprar barato, vender com margem)</h2>
        <p>Você identifica um produto com bom preço na Shopee ou Mercado Livre, compra e revende ao cliente final por um valor maior, cobrindo custo do produto, frete, CPA do anúncio e sua margem. Nesse modelo <strong>você</strong> compra o produto e envia para a casa do cliente.</p>

        <h2 class="sec">Afiliado pela Hype</h2>
        <p>Fluxo do modelo de afiliado:</p>
        <ol>
          <li>Faça o cadastro na plataforma <strong>Hype</strong>;</li>
          <li>Pegue o link de afiliado do produto escolhido;</li>
          <li>Feche a venda com o cliente pelo WhatsApp e finalize o pedido usando esse link, com o endereço do cliente;</li>
          <li>O pedido vai direto pro cliente pela logística da própria Hype — você não compra nem estoca nada, só investe em anúncio;</li>
          <li>A comissão cai primeiro na própria plataforma Hype e, segundo o fluxo informado, costuma liberar pra sua conta em torno de <strong>7 dias</strong> — confirme o prazo atualizado direto no painel da Hype, pois isso pode mudar.</li>
        </ol>
        <div class="warn"><div class="warn-title">⚠ Acompanhe a entrega até o fim</div>
        <p style="margin:0">Depois de fechar o pedido, fique de olho no status até a entrega. Às vezes o motoboy chega e não consegue contato com o cliente — vale você mesmo chamar o cliente pra confirmar que vai estar em casa. Se a entrega falha por ausência, você perde o valor da corrida (na faixa de uns R$ 4) sem ganhar a comissão. É um risco pequeno por pedido, mas some se você deixar passar em vários.</p></div>

        <h2 class="sec">Hype x Revenda (Shopee/Mercado Livre) — a diferença de risco</h2>
        <div class="table-wrap"><table>
        <tr><th></th><th>Hype (afiliado)</th><th>Revenda (Shopee/ML)</th></tr>
        <tr><td>Comissão/margem</td><td>Menor por venda</td><td>Maior por venda</td></tr>
        <tr><td>Quem cuida da logística</td><td>A própria Hype (compra, envio, motoboy)</td><td>Você (compra o produto e envia pro cliente)</td></tr>
        <tr><td>O que você arrisca perder</td><td>~R$ 4 da corrida, se o cliente não estiver em casa</td><td>O valor do produto comprado, se o cliente recusar/não pagar</td></tr>
        </table></div>
        <p>Na prática: pela Hype o prejuízo por pedido perdido é pequeno (só a corrida). Pela revenda o prejuízo por pedido perdido é maior (o produto inteiro), mas a margem por venda também é maior — segundo o padrão relatado na operação, de cada 50 vendas fechadas cerca de 5 não se concretizam, e mesmo assim a conta fecha no positivo porque a margem das 45 restantes cobre essa perda. Vale você acompanhar sua própria taxa de recusa pra confirmar se esse equilíbrio se sustenta no seu caso.</p>

        <p>Nada impede rodar os dois modelos em paralelo, testando qual performa melhor por produto.</p>`},
      pagamento:{ label:"Pagamento na entrega", title:"Pagamento na entrega: Pix, boleto e cartão",
        html:`<p>O modelo de cobrança na entrega reduz a barreira de quem tem receio de pagar adiantado. Alguns cuidados tornam esse fluxo mais seguro:</p>
        <ul>
          <li>Confirme endereço completo e telefone de contato antes de despachar;</li>
          <li>Combine por escrito, no próprio WhatsApp, o valor e a forma de pagamento;</li>
          <li>Guarde o comprovante do Pix/pagamento recebido;</li>
          <li>Tenha uma política clara para recusa do produto na entrega.</li>
        </ul>

        <div class="warn"><div class="warn-title">⚠ Sobre o risco da recusa</div>
        <p style="margin:0">Nem todo pedido é pago quando chega — uma parte dos clientes recusa ou não atende. A maioria paga, mas essa taxa de recusa varia por região e produto e <strong>precisa</strong> estar embutida no seu preço (veja a fórmula no módulo "Modelo de vendas"). Trate a recusa como um custo normal da operação, não como uma exceção rara — assim o resultado fecha no fim do mês mesmo com alguma perda.</p></div>

        <h2 class="sec">Cartão x Pix na conta de anúncios</h2>
        <p>Na conta de anúncios você pode vincular <strong>cartão de crédito</strong> ou <strong>Pix</strong> como forma de pagamento:</p>
        <ul>
          <li><strong>Cartão de crédito</strong> (preferência mais indicada): a campanha vai gastando ao longo do mês e você paga tudo de uma vez na fatura — mais fôlego de caixa;</li>
          <li><strong>Pix:</strong> funciona por saldo, então é preciso ir adicionando valor periodicamente (diário ou semanal) conforme o ritmo de gasto da campanha, pra não correr o risco de faltar saldo e pausar o anúncio.</li>
        </ul>

        <p>Manter um registro simples de cada venda (mesmo numa planilha) ajuda a identificar padrões de recusa por região ou produto, e facilita a vida em caso de questionamento posterior do cliente.</p>`}
    }
  },
  campanha: {
    icon:"🚀", label:"Primeira campanha",
    subs:{
      estrutura:{ label:"Estrutura (1/3/3)", title:"Como subir a primeira campanha — Modelo 1/3/3",
        html:`<p>Modelo: <strong>1 campanha, 3 conjuntos, 3 criativos</strong>. A ideia é manter a comparação simples: os 3 conjuntos são praticamente iguais, e o que muda é o criativo dentro de cada um.</p>
        <div class="card"><div class="card-title">Tipos de campanha</div>
        <ul style="margin:0">
          <li><strong>Hype</strong> — localização selecionada manualmente, só com as cidades atendidas (veja a lista completa na aba "Publicar, métricas e cobertura");</li>
          <li><strong>Brasil inteiro</strong> — campanha nacional, localização "Brasil" com Advantage+ Location ligado.</li>
        </ul></div>
        <p><strong>Por onde começar:</strong> primeiro suba a campanha Hype usando as cidades atendidas. Depois, quando quiser escalar nacionalmente, use a configuração Brasil inteiro.</p>
        <div class="warn"><div class="warn-title">⚠ Não misture as duas configurações no mesmo conjunto</div>
        <p style="margin:0">Hype (cidades manuais, Advantage+ Location desativado) e Brasil inteiro (Advantage+ Location ativado) são direcionamentos diferentes — não combine os dois num mesmo conjunto de anúncios.</p></div>`},

          <li>Escolha o objetivo: <strong>Vendas</strong>;</li>

        <h2 class="sec">Criar os anúncios (3 criativos diferentes)</h2>
        <p>O produto selecionado precisa aparecer claramente em todos os criativos:</p>

          <li><strong>Criativo 2</strong> — benefício principal + demonstração;</li>
          <li><strong>Criativo 3</strong> — oferta + chamada para WhatsApp.</li>
        </ol>

      oferta:{ label:"Como montar a oferta", title:"Como preparar e apresentar a oferta pro cliente",
        html:`<p>Baseado no seu fluxo de atendimento automatizado, esse é o roteiro que funciona pra apresentar a oferta e conduzir até o fechamento:</p>
        <ol>
          <li><b>Vídeo de demonstração</b> — manda um vídeo curto mostrando o produto em uso/resultado;</li>
          <li><b>Confirmação de interesse</b> — pergunta algo como "me avisa quando terminar de assistir que eu te passo os valores?" — isso qualifica quem realmente está prestando atenção;</li>
          <li><b>Espera com timeout</b> — se a pessoa não responder em um tempo (ex: 1-2h), o fluxo reativa sozinho com uma nova mensagem puxando de volta a conversa;</li>
          <li><b>Apresentação da oferta</b> — envia valores com uma condição especial pra levar mais de uma unidade (ex: "levando 2 você ganha até 25% de desconto");</li>
          <li><b>Fechamento</b> — confirma produto, endereço e forma de pagamento.</li>
        </ol>
        <div class="card"><div class="card-title">Sobre a linha do gancho no vídeo</div>
        <p style="margin:0">Se o seu fluxo atual usa alguma linha de resultado exagerado (tipo "ajudamos +10 mil pessoas a perder barriga"), troque por algo que descreva o produto sem prometer resultado de saúde — ex: "veja como fica o caimento com a nossa regata" — o resto do fluxo (espera, oferta, desconto por 2 unidades) pode continuar igual.</p></div>`},

      minerar:{ label:"Minerar seu próprio produto", title:"Como minerar um novo produto (além destes dois)",
        html:`<p>Esses dois produtos (resina e regata) são só o ponto de partida. O processo pra encontrar o próximo produto é o mesmo:</p>

const menuEl = document.getElementById('menu');
const contentEl = document.getElementById('content');
let currentModule = 'intro', currentSub = null;

function buildMenu(){
  menuEl.innerHTML = '';
  Object.keys(DATA).forEach(key=>{
    const mod = DATA[key];
    const wrap = document.createElement('div');
    wrap.className = 'module';
    wrap.id = 'mod-'+key;

    const btn = document.createElement('button');
    btn.className = 'module-btn';
    btn.innerHTML = `<span class="module-icon">${mod.icon}</span><span>${mod.label}</span>` + (mod.subs ? '<span class="chev">▸</span>' : '');
    btn.onclick = ()=>{
      if(mod.subs){
        const isOpen = wrap.classList.contains('open');
        document.querySelectorAll('.module').forEach(m=>m.classList.remove('open'));
        if(!isOpen){ wrap.classList.add('open'); }
        const firstSub = Object.keys(mod.subs)[0];
        selectModule(key, firstSub);
      } else {
        document.querySelectorAll('.module').forEach(m=>m.classList.remove('open'));
        selectModule(key, null);
      }
    };
    wrap.appendChild(btn);

    if(mod.subs){
      const sub = document.createElement('div');
      sub.className = 'submenu';
      Object.keys(mod.subs).forEach(subKey=>{
        const sb = document.createElement('button');
        sb.className = 'sub-btn';
        sb.textContent = mod.subs[subKey].label;
        sb.id = 'sub-'+key+'-'+subKey;
        sb.onclick = (e)=>{ e.stopPropagation(); selectModule(key, subKey); };
        sub.appendChild(sb);
      });
      wrap.appendChild(sub);
    }
    menuEl.appendChild(wrap);
  });
}

function selectModule(modKey, subKey){
  currentModule = modKey; currentSub = subKey;
  document.querySelectorAll('.module-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mod-'+modKey).querySelector('.module-btn').classList.add('active');
  if(subKey){
    document.getElementById('mod-'+modKey).classList.add('open');
    document.getElementById('sub-'+modKey+'-'+subKey).classList.add('active');
  }
  render();
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo(0,0);
}

function render(){
  const mod = DATA[currentModule];
  const data = subKeyFor(mod, currentSub);
  contentEl.innerHTML = `
    <div class="eyebrow">${mod.label}${currentSub ? ' / ' + mod.subs[currentSub].label : ''}</div>
    <h1 class="page-title">${data.title}</h1>
    ${data.lede ? `<p class="lede">${data.lede}</p>` : ''}
    ${data.html}
  `;
}
function subKeyFor(mod, subKey){
  if(mod.standalone) return mod;
  return mod.subs[subKey];
}

buildMenu();
selectModule('intro', null);

document.getElementById('menuToggle').onclick = ()=>{
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('overlay').classList.add('show');
};
document.getElementById('overlay').onclick = ()=>{
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('show');
};
</script>

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } .ap-reveal { opacity: 1; transform: none; filter: none; } }
</style>
<script id="afterpay-cinematic-scroll">
(function(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window)) return;
  const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('ap-visible'); observer.unobserve(entry.target); } }), { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
  const content = document.getElementById('content');
  const decorate = () => { if (!content) return; content.querySelectorAll('.content > *, .content h1, .content h2, .content h3, .content .card, .content .example, .content .callout, .content table, .content .module-section').forEach((el, i) => { if (el.dataset.apReveal) return; el.dataset.apReveal = '1'; el.classList.add('ap-reveal'); el.style.transitionDelay = Math.min((i % 5) * 55, 220) + 'ms'; observer.observe(el); }); };
  if (content) { decorate(); new MutationObserver(decorate).observe(content, { childList: true, subtree: true }); }
})();
</script>
